<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Session Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        button:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .code {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔓 Quick Session Fix</h1>
        <p class="subtitle">Fix authentication to access payroll pages</p>

        <div id="status" class="status info">
            Click the button below to set your session and access the payroll page.
        </div>

        <button onclick="fixSessionAndRedirect()">
            ✓ Fix Session & Go to Payroll
        </button>

        <div class="code">
            <strong>Target:</strong> http://localhost:3001/payroll/5<br>
            <strong>Session ID:</strong> 037d7cad545cf087075320f688470588
        </div>
    </div>

    <script>
        function fixSessionAndRedirect() {
            // Set the latest valid session
            localStorage.setItem('sessionId', '037d7cad545cf087075320f688470588');

            // Set user data for user 21 (aim19)
            const userData = {
                id: 21,
                username: 'aim19',
                email: 'gmia0519@gmail.com',
                role: 'HR',
                is_active: 1,
                assigned_branch: 'Ormoc',
                employee_id: '9'
            };
            localStorage.setItem('user', JSON.stringify(userData));

            // Update status
            document.getElementById('status').className = 'status success';
            document.getElementById('status').innerHTML = '✓ Session fixed! Redirecting to payroll page...';

            // Redirect after a short delay
            setTimeout(() => {
                window.location.href = 'http://localhost:3001/payroll/5';
            }, 1000);
        }
    </script>
</body>

</html>
